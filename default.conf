server {
    listen 80;
    server_name localhost;

    # Define the shared authorization validation hook
    location = /_validate_session {
        internal; 
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_pass http://auth:3000/auth;
    }

    # Serve the static fallback login page
    location = /login {
        auth_request off;

        root /usr/share/nginx/html;
        try_files /login.html =404;
    }

    location = /style.css {
        auth_request off;

        root /usr/share/nginx/html;
    }

    # Proxy ALL auth-related backend endpoints to the Express app
    location ~ ^/auth {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://auth:3000;
    }

    location /api/auth {
        auth_request /_validate_session;
        error_page 401 = /login;
        rewrite ^/api/(.*)$ /$1 break;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://vibe-deployment-backend:4000;
    }

    location /api/chat {
        auth_request /_validate_session;
        error_page 401 = /login;
        rewrite ^/api/(.*)$ /$1 break;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://vibe-deployment-backend:4000;
    }

    location /api/chats {
        auth_request /_validate_session;
        error_page 401 = /login;
        rewrite ^/api/(.*)$ /$1 break;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://vibe-deployment-backend:4000;
    }

    location /api/projects {
        auth_request /_validate_session;
        error_page 401 = /login;
        rewrite ^/api/(.*)$ /$1 break;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://coolify-operator:3000;
    }

    location / {
        auth_request /_validate_session;
        error_page 401 = /login;
        
        auth_request_set $auth_id $upstream_http_x_user_id;
        auth_request_set $auth_email $upstream_http_x_user_email;

        proxy_set_header X-User-Id $auth_id;
        proxy_set_header X-User-Email $auth_email;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://vibe-deployment-frontend:3000;
    }

    location ^~ /_next/ {
        auth_request off;

        expires 365d;
        access_log off;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://vibe-deployment-frontend:3000;
    }

    # Handle assets that are NOT inside the Next.js /_next/ folder
    location ~* \.(js|css|png|jpg|jpeg|gif|ico)$ {
        auth_request off;

        expires 1y;
        add_header Cache-Control "public, must-revalidate, proxy-revalidate";
        try_files $uri @fallback_to_frontend;
    }

    # Named fallback location if non-Next static assets fail to find local files
    location @fallback_to_frontend {
        auth_request off;

        proxy_pass http://vibe-deployment-frontend:3000;
    }
}
